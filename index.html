const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],money=n=>n.toLocaleString()+" MAD";let data={},who="",date="2026-10-02";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pack,password){const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(pack.salt),iterations:200000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(pack.iv)},key,b64(pack.ct));return JSON.parse(new TextDecoder().decode(plain))}
function allRows(){return Object.values(data).flat()}function stats(rows){$("#pay").textContent=money(rows.reduce((a,r)=>a+r[4],0));$("#classes").textContent=rows.length;$("#seats").textContent=rows.reduce((a,r)=>a+r[3],0);$("#teachers").textContent=new Set(rows.map(r=>r[1])).size}
function renderDay(){const rows=data[date]||[];stats(rows);$("#rows").innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="right">${r[3]}</td><td class="right"><strong>${money(r[4])}</strong></td></tr>`).join("")||'<tr><td colspan="5">No classes on this date.</td></tr>'}
function renderWeek(){const rows=allRows();stats(rows);const g={};rows.forEach(r=>{g[r[1]]??={c:0,s:0,p:0};g[r[1]].c++;g[r[1]].s+=r[3];g[r[1]].p+=r[4]});$("#teacherGrid").innerHTML=Object.entries(g).map(([n,x])=>`<div class="teacher-card"><strong>${n}</strong><div style="font-size:1.4rem;margin-top:7px">${money(x.p)}</div><div class="muted">${x.c} classes · ${x.s} class-seats</div></div>`).join("")}
function renderMonth(){const rows=allRows();stats(rows);$("#monthText").innerHTML=Object.entries(data).map(([d,rs])=>`<p>${d}: <strong>${money(rs.reduce((a,r)=>a+r[4],0))}</strong> · ${rs.length} classes · ${rs.reduce((a,r)=>a+r[3],0)} class-seats</p>`).join("")}
function setView(v){$("#dayPanel").classList.toggle("hidden",v!=="day");$("#weekPanel").classList.toggle("hidden",v!=="week");$("#monthPanel").classList.toggle("hidden",v!=="month");$$("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));v==="day"?renderDay():v==="week"?renderWeek():renderMonth()}
$("#enter").onclick=async()=>{who=$("#acct").value;$("#err").textContent="";try{data=await decrypt(PACKS[who],$("#code").value.trim().toUpperCase());$("#login").classList.add("hidden");$("#app").classList.remove("hidden");$("#title").textContent=who==="ADMIN"?"Talk Today Payroll — Admin":who+" — My Pay";$("#subtitle").textContent=who==="ADMIN"?"All payroll data":"Private teacher view";renderDay()}catch(e){$("#err").textContent="Incorrect access code."}}
$("#logout").onclick=()=>location.reload();$$("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));$$("[data-date]").forEach(b=>b.onclick=()=>{date=b.dataset.date;$$("[data-date]").forEach(x=>x.classList.toggle("active",x===b));renderDay()});
